<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimerland-Hotel</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#000;
color:white;
}

header{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

header h1{
font-size:4rem;
color:#22c55e;
}

section{
padding:60px 10%;
}

.card{
background:#111;
padding:25px;
border-radius:20px;
margin-bottom:25px;
border:1px solid #22c55e;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
}

#timer{
font-size:4rem;
text-align:center;
color:#22c55e;
}

button{
padding:15px 30px;
background:#22c55e;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

#winnerBtn{
display:none;
margin-top:20px;
}
</style>
</head>

<body>

<header>
<div>
<h1>Nimerland-Hotel</h1>
<p>Exklusive Hochzeiten am Meer</p>
</div>
</header>

<section>

<div class="card">
<h2>Unsere Hochzeitswelt</h2>

<p>
Willkommen im Nimerland-Hotel.
Entdecken Sie unvergessliche Hochzeiten direkt am Meer.
</p>

</div>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=900&q=80">

<img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=900&q=80">

<img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=900&q=80">

</div>

</section>

<section>

<div class="card">

<h2>Verlosung</h2>

<div id="timer">
00:10
</div>

<br>

<button onclick="startCountdown()">
Auslosung starten
</button>

<br>

<button id="winnerBtn"
onclick="window.location.href='winners.html'">
Gewinner anzeigen
</button>

</div>

</section>

<script>

let started=false;

function startCountdown(){

if(started) return;

started=true;

let seconds=120;

const timer=
document.getElementById("timer");

let interval=setInterval(()=>{

let m=Math.floor(seconds/60);

let s=seconds%60;

timer.innerText=
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

seconds--;

if(seconds<0){

clearInterval(interval);

document.getElementById(
"winnerBtn"
).style.display="inline-block";

}

},1000);

}

</script>

</body>
</html>
